[workspace]
resolver = "3"
members = [
    # Shared crates.
    "crates/core",
    "crates/doc",
    "crates/engine-api",
    "crates/exiv2-sys",
    "crates/isolate",
    "crates/library",
    "crates/libraw-sys",
    "crates/remote",
    # Aigle applications, renderer, and development tools.
    "crates/aigle/app",
    "crates/aigle/cli",
    "crates/aigle/engine",
    "crates/aigle/kernels",
    "crates/aigle/lensfun",
    "crates/aigle/rtprocess-sys",
    "crates/aigle/vips-sys",
    "crates/aigle/xtask",
    # Thesauros applications.
    "crates/thesauros/server",
]
# Nightly-only SPIR-V build (doc 04 §3); has its own workspace and toolchain.
exclude = ["crates/aigle/kernels-build", "vendor/gpui-pre", "vendor/gpui-pre-wgpu", "vendor/gpui-pre-linux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://example.invalid/aigle"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"
aigle-core = { path = "crates/core" }
aigle-engine-api = { path = "crates/engine-api" }
aigle-kernels = { path = "crates/aigle/kernels" }
aigle-engine = { path = "crates/aigle/engine" }
aigle-doc = { path = "crates/doc" }
aigle-libraw-sys = { path = "crates/libraw-sys" }
aigle-rtprocess-sys = { path = "crates/aigle/rtprocess-sys" }
aigle-vips-sys = { path = "crates/aigle/vips-sys" }
aigle-exiv2-sys = { path = "crates/exiv2-sys" }
aigle-library = { path = "crates/library" }
aigle-remote = { path = "crates/remote" }
aigle-lensfun = { path = "crates/aigle/lensfun" }
aigle-isolate = { path = "crates/isolate" }

blake3 = "1.8"
bytemuck = { version = "1.23", features = ["extern_crate_alloc"] }
futures = "0.3.31"
half = { version = "2.6", features = ["bytemuck"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "tiff"] }
libm = "0.2.15"
parking_lot = "0.12.4"
rayon = "1.11"
# Bundled SQLite: the catalog must not depend on the system library's version.
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
# Safe renameat2(RENAME_NOREPLACE) for moving photos without overwriting; poll, pipe sizes
# and stdio redirection for worker processes.
rustix = { version = "1.1.6", features = ["fs", "event", "pipe", "stdio", "net"] }
schemars = "1.0"
serde = { version = "1.0.219", features = ["derive", "rc"] }
# float_roundtrip: decoder results cross the worker boundary as JSON and must parse back
# to the same f64.
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
thiserror = "2.0.12"
tokio = { version = "1.47", default-features = false, features = ["sync"] }
tracing = "0.1.41"
trash = "5.2.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.dev]
# Pixel loops are unusable unoptimised; keep debug info but optimise deps and our crates a bit.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

# Native HDR canvas integration; patches preserve GPUI image rendering for other UI.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
