[package]
name = "aigle-libraw-sys"
description = "Managed patched LibRaw 0.22.2 plus a narrow C shim used by the aigle A tier"
version.workspace = true
edition.workspace = true
# The crate glue is AGPL; the managed LibRaw port includes upstream license notices.
license = "AGPL-3.0-only AND (LGPL-2.1-only OR CDDL-1.0)"
rust-version.workspace = true
links = "aigle_libraw"
build = "build.rs"

[dependencies]

[dev-dependencies]
image.workspace = true

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
pkg-config = "0.3.32"
