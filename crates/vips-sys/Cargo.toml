[package]
name = "aigle-vips-sys"
description = "Narrow C shim over the system libvips (and libexif) for aigle image I/O"
version.workspace = true
edition.workspace = true
# The crate glue is AGPL like the workspace; it links the system libvips and libexif
# (LGPL-2.1-or-later) dynamically.
license = "AGPL-3.0-only"
rust-version.workspace = true
links = "aigle_vips"
build = "build.rs"

[dependencies]

[build-dependencies]
cc = "1.2"
pkg-config = "0.3.32"
